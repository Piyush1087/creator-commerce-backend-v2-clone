id: brand_meaning_output_contract
version: "1.0"
status: FROZEN
processor: brand_meaning
objects: [brand_description, positioning, value_proposition]
strict: true
additional_properties: false
processor_definition: intelligence/engines/brand_intelligence/branches/brand_expression/processors/brand_meaning.yaml
reasoning_authority: intelligence/engines/brand_intelligence/branches/brand_expression/artifacts/brand_meaning/reasoning.yaml
object_authority: intelligence/engines/brand_intelligence/branches/brand_expression/objects.yaml
shared_metadata_authority: intelligence/architecture/shared_intelligence_metadata_contract.yaml

response:
  type: object
  required: [brand_description, positioning, value_proposition, output_metadata]
  additional_properties: false
  properties:
    brand_description: {type: [string, "null"], nullable: true, min_length_when_non_null: 1}
    positioning: {type: [string, "null"], nullable: true, min_length_when_non_null: 1}
    value_proposition: {type: [string, "null"], nullable: true, min_length_when_non_null: 1}
    output_metadata:
      type: object
      required: [brand_description, positioning, value_proposition]
      additional_properties: false
      fields:
        brand_description: {type: [object, "null"], nullable: true, schema: shared_generated_metadata}
        positioning: {type: [object, "null"], nullable: true, schema: shared_generated_metadata}
        value_proposition: {type: [object, "null"], nullable: true, schema: shared_generated_metadata}

shared_generated_metadata:
  additional_properties: false
  required: [authority, source_class, freshness, evidence_refs]
  fields:
    authority: {type: enum, values: [OBSERVED, CREATOR_SHOP_DERIVED, SYSTEM_DERIVED], forbidden: [BRAND_CONFIRMED, SUPPORT_CONTROLLED]}
    source_class: {type: enum, values: [OWNED_WEBSITE, BRAND_USER_INPUT, CANONICAL_BUSINESS_STATE, MULTI_SOURCE, SYSTEM_DERIVATION_INPUT]}
    freshness: {type: enum, values: [CURRENT, STALE, UNKNOWN]}
    evidence_refs: {type: array, unique_items: true, item_type: string}
    business_state_refs: {type: array, required: false, unique_items: true, item_type: string}

partial_shape_rules:
  independent_nullability: true
  all_three_non_null_required: false
  all_three_null_allowed_when_no_defensible_output: true
  no_filler_to_force_ready: true
  metadata_alignment:
    - null_semantic_requires_null_metadata
    - non_null_semantic_requires_non_null_metadata
    - non_null_output_requires_evidence_or_business_state_lineage

structural_validation:
  reject_additional_properties: true
  reject_blank_non_null_strings: true
  reject_missing_metadata_for_non_null_output: true
  reject_metadata_without_corresponding_non_null_output: true

semantic_validation:
  brand_description:
    - brand_level_not_single_offering
    - no_preview_direct_promotion
    - no_tagline_campaign_statement_or_generic_praise
  positioning:
    - distinct_from_brand_description_and_value_proposition
    - unsupported_leadership_premium_dominance_market_share_preference_invalid
    - competitor_ranking_invalid
  value_proposition:
    - customer_value_exchange_distinct_from_positioning
    - unsupported_outcome_efficacy_performance_or_superiority_invalid
    - offering_specific_value_not_generalized_without_brand_support
  cross_output:
    - materially_equivalent_paraphrases_invalid
    - positioning_not_equal_value_proposition
    - preview_output_promotion_invalid

industry_claim_safety:
  healthcare: [treatment_efficacy, clinical_outcome, diagnosis_claim, guaranteed_health_result, medical_superiority]
  saas_ai: [productivity_improvement, performance_improvement, accuracy_gain, time_saving, roi_guarantee]
  d2c_services: [objective_superiority, best_or_leading, guaranteed_outcome]

protected_current_state_validation:
  ordinary_refresh_must_not_replace_brand_confirmed: true
  processor_emitted_brand_confirmed: invalid
  processor_emitted_support_controlled: invalid

source_and_lineage_validation:
  provider_names_as_source_classes: invalid
  shared_metadata_source_vocabulary_required: true

readiness:
  bounded_partial_output_supported: true
  no_brand_preview_gate: true
  no_verification_gate: true
  no_home_gate: true
