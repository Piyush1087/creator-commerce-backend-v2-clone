version: "1.0"
status: FROZEN
engine: brand_intelligence
branch: visual_identity
contract: objects
shared_metadata_contract: intelligence/architecture/shared_intelligence_metadata_contract.yaml

branch_purpose: >-
  Maintain grounded reusable interpretation of Brand visual patterns for Brand Centre,
  Chat, Campaign Brief generation, Creator Strategy, creator visual guidance,
  future creative generation and future Brand consistency evaluation, without owning
  canonical Brand asset CRUD/state or raw extraction outputs.

topology:
  durable_objects:
    - visual_style_profile
  top_level_object_count: 1
  prohibited_visual_identity_objects:
    - logo
    - palette
    - typography
    - imagery_reference_library
    - observed_logo_candidates
    - observed_palette_candidates
    - observed_typography_candidates
    - observed_brand_imagery_candidates
  overall_brand_topology:
    state: PROVISIONAL
    rule: >-
      Visual Identity may be independently frozen, but the overall Brand Intelligence topology
      remains provisional until Brand Expression, Audience, Visual Identity and Geography/Locations
      are reconciled together and pass a cross-branch Systems Architect review.

canonical_visual_business_state:
  intelligence_ownership: false
  role: CANONICAL_BUSINESS_STATE_REFERENCE
  conceptual_inputs:
    primary_logo:
      stable_asset_identity_required: true
    secondary_logo_or_marks:
      type: array
      stable_asset_identity_required: true
    approved_palette:
      type: array
    approved_heading_font:
      nullable: true
    approved_body_font:
      nullable: true
    approved_reference_images:
      type: array
      stable_asset_identity_required: true
  canonical_asset_identity:
    conceptual_key: canonical_visual_asset_id
    purpose: >-
      Allow downstream Intelligence and Campaign/Brief consumers to reference durable approved
      visual assets rather than ephemeral website URLs.
    storage_implementation: DEFERRED
  duplication_rule: >-
    visual_style_profile may reference canonical visual-state IDs/refs but must not duplicate
    exact logo assets, approved palette entries, approved font selections, or reference-image records.

evidence_candidate_boundary:
  observed_visual_signals:
    examples:
      - probable website logo
      - repeated website or CSS colour
      - detected font
      - website image
    classification: NORMALIZED_EVIDENCE_OR_TRANSIENT_CANDIDATE
    durable_intelligence: false
    canonical_business_state: false
    persist_every_candidate: false
  canonical_flow:
    - observed visual signal
    - normalized Evidence
    - optional transient candidate
    - Brand/application acceptance when required
    - canonical visual business state
  provider_names_in_semantics: forbidden
  extraction_mechanics_in_semantics: forbidden

legacy_compatibility:
  identity_brand_logo:
    status: COMPATIBILITY_ONLY
    identity_branch_mutation: forbidden
    current_preview_consumer_preserved: true
    future_migration_direction:
      - Identity brand_logo
      - explicit later remap
      - canonical Brand primary-logo asset/state
      - Visual Identity dependency
  brand_preview:
    optional_logo_path: existing_identity_compatibility
    visual_style_profile_required: false
    visual_identity_completion_blocks:
      Brand_Preview: false
      verification: false
      Home: false

shared_rules:
  no_onboarding_gate: true
  partial_maturity_allowed: true
  source_authority_separation: true
  readiness_freshness_separation: true
  protected_current_state_vs_derivation:
    derivation_dependencies:
      meaning: >-
        Canonical visual business-state refs, owned visual Evidence, and explicit Brand visual guidance
        that may be used to derive or refresh CREATOR_SHOP_DERIVED visual interpretation.
      may_trigger_recompute: true
    protected_current_authoritative_state:
      meaning: >-
        BRAND_CONFIRMED profile subfields/items or explicit visual constraints that remain authoritative
        while new Evidence may be compared against them.
      ordinary_derivation_input_for_replacement: false
      silent_replacement: forbidden
      conflict_behavior: preserve protected semantics and record or surface discrepancy for later resolution policy.
  generation_lineage_required_for_derived_outputs:
    - producer
    - processor_version
    - execution_id
    - generated_at
    - evidence_refs
  confidence:
    universally_required: false
    allowed_values: [HIGH, MEDIUM, LOW]
    numeric_percentage_required: false

objects:
  - id: visual_style_profile
    semantic_identity:
      domain: brand_intelligence
      branch: visual_identity
      semantic_key: visual_style_profile
    definition: >-
      Grounded reusable interpretation of recurring Brand visual patterns that materially helps
      creator communication, Campaign Brief generation, future creative generation and Brand-consistency evaluation.
    why_it_exists: >-
      Converts approved visual state and observed visual Evidence into reusable Brand-level visual understanding
      without duplicating canonical assets/settings or inventing Campaign-specific creative direction.
    type: object
    nullable: true
    partial_maturity: true

    structure:
      fields:
        summary:
          type: string
          nullable: true
          semantic_role: DESCRIPTIVE_VISUAL_INTERPRETATION
          metadata_granularity:
            authority: subfield
            source: subfield
            freshness: subfield_optional
            confidence: subfield_optional
            supersession: subfield_optional

        style_traits:
          type: array
          nullable: true
          semantic_role: DESCRIPTIVE_VISUAL_INTERPRETATION
          item:
            semantic_id:
              required: true
            trait:
              type: string
              required: true
            metadata_granularity:
              authority: item
              source: item
              freshness: item_optional
              confidence: item_optional
              supersession: item_optional

        imagery_style:
          type: object
          nullable: true
          fields:
            photographic_tendencies:
              type: array
              nullable: true
              semantic_role: DESCRIPTIVE_VISUAL_INTERPRETATION
              item:
                semantic_id: {required: true}
                value: {type: string, required: true}
                metadata_granularity:
                  authority: item
                  source: item
                  freshness: item_optional
                  confidence: item_optional
            subject_tendencies:
              type: array
              nullable: true
              semantic_role: DESCRIPTIVE_VISUAL_INTERPRETATION
              item:
                semantic_id: {required: true}
                value: {type: string, required: true}
                metadata_granularity:
                  authority: item
                  source: item
                  freshness: item_optional
                  confidence: item_optional
            mood_or_treatment:
              type: array
              nullable: true
              semantic_role: DESCRIPTIVE_VISUAL_INTERPRETATION
              item:
                semantic_id: {required: true}
                value: {type: string, required: true}
                metadata_granularity:
                  authority: item
                  source: item
                  freshness: item_optional
                  confidence: item_optional

        graphic_treatment:
          type: object
          nullable: true
          fields:
            traits:
              type: array
              nullable: true
              semantic_role: DESCRIPTIVE_VISUAL_INTERPRETATION
              item:
                semantic_id: {required: true}
                value: {type: string, required: true}
                metadata_granularity:
                  authority: item
                  source: item
                  freshness: item_optional
                  confidence: item_optional

        visual_constraints:
          type: array
          nullable: true
          semantic_role: EXPLICIT_BRAND_VISUAL_CONSTRAINT
          descriptive_patterns_may_auto_promote_to_constraint: false
          item:
            semantic_id:
              required: true
            rule:
              type: string
              required: true
            authority_requirement:
              allowed: [BRAND_CONFIRMED]
              other_future_accepted_authority: allowed_only_when_explicitly_defined
              CREATOR_SHOP_DERIVED_hard_constraint: forbidden
              OBSERVED_hard_constraint: forbidden
            metadata_granularity:
              authority: item
              source: item
              freshness: item_optional
              supersession: item_optional

    descriptive_vs_prescriptive:
      descriptive_semantic: DESCRIPTIVE_VISUAL_INTERPRETATION
      descriptive_default_authority: CREATOR_SHOP_DERIVED
      descriptive_rule: >-
        Observed recurring patterns may be summarized as descriptive interpretation but do not become mandatory rules.
      prescriptive_semantic: EXPLICIT_BRAND_VISUAL_CONSTRAINT
      prescriptive_rule: >-
        A normative or hard visual requirement must come from explicit Brand-authored guidance,
        explicit Brand confirmation, or another future accepted Product authority.
      example:
        descriptive: Uses minimal overlays and high whitespace.
        forbidden_automatic_promotion: Creators must never use dense graphics.

    canonical_business_state_refs:
      allowed_dependencies:
        - primary_logo_ref
        - secondary_logo_or_mark_refs
        - approved_palette_ref
        - approved_typography_ref
        - approved_reference_image_refs
        - explicit_Brand_visual_guidance_ref
      exact_values_duplicated_in_profile: false

    derivation_dependencies:
      canonical_business_state_refs:
        - canonical primary/alternate asset refs
        - approved palette
        - approved typography
        - approved reference imagery
        - explicit Brand visual guidance
      evidence_classes:
        - owned visual Evidence
        - owned website visual Evidence
      all_dependencies_required_for_partial_profile: false
      protected_current_authoritative_state:
        allowed: true
        granularity: item_or_subfield
        rule: >-
          BRAND_CONFIRMED profile components or explicit constraints may be compared against new Evidence
          but are not ordinary derivation input authorizing replacement.

    source:
      supported_base_classes:
        - CANONICAL_BUSINESS_STATE
        - OWNED_WEBSITE
        - BRAND_USER_INPUT
        - MULTI_SOURCE
      provider_names_as_source_classes: forbidden

    authority:
      profile_default: CREATOR_SHOP_DERIVED
      supported_for_descriptive_fields: [CREATOR_SHOP_DERIVED, BRAND_CONFIRMED]
      visual_constraints_required_authority: BRAND_CONFIRMED
      mixed_authority_within_object: true
      aggregate_authority_required: false
      Brand_confirmation_transition:
        from: [CREATOR_SHOP_DERIVED]
        to: BRAND_CONFIRMED
      protected_refresh_rule: >-
        BRAND_CONFIRMED items/subfields remain authoritative while unprotected derived components may refresh independently.

    readiness:
      consumer_scoped: true
      states: [READY, PARTIAL, NOT_READY, FAILED]
      rules:
        Brand_Centre: partial profile may be useful alongside canonical visual business state
        Chat: partial profile may be useful as optional visual context
        Campaign_Brief: usable profile fields may be consumed with canonical asset refs; full profile not universally required
        Creator_Strategy: optional context only unless later contract requires more
        creator_visual_guidance: stronger profile maturity may be preferred
        future_creative_generation: later contract may require stronger canonical visual state and profile readiness
        future_Brand_consistency_evaluation: later contract may define stronger readiness
      insufficient_evidence_behavior:
        allowed: [PARTIAL, NOT_READY, null]
        aesthetic_filler: forbidden

    freshness:
      no_global_ttl: true
      Brand_confirmed_may_be_STALE_and_authoritative: true
      independently_refreshable_components: true
      higher_refresh_sensitivity:
        - imagery_style
        - graphic_treatment
        - style_traits
      lower_refresh_sensitivity:
        - explicit Brand-confirmed visual constraints

    invalidation:
      directed_only: true
      whole_Brand_Intelligence_rerun: forbidden
      examples:
        - event: Brand replaces approved reference imagery
          effect: imagery-related profile components become STALE and visual_style_profile becomes reevaluation candidate
        - event: Brand changes canonical logo
          effect: only materially affected style interpretation is reevaluated
        - event: Brand updates explicit visual constraint
          effect: dependent creator/Brief guidance becomes reevaluation candidate without rerunning unrelated Brand branches
      unrelated_branches_not_automatically_invalidated:
        - Audience
        - Brand Expression
        - Geography
      active_Campaign_instruction_rewrite: forbidden
      note: Campaign/Brief snapshot and active-work reconciliation remain downstream authority.

    supersession:
      supported: true
      item_and_subfield_history_supported: true
      historical_lineage_preserved: true
      stale_does_not_equal_superseded: true

    confidence:
      optional: true
      materially_justified_for:
        - derived style traits
        - photographic tendencies
        - subject tendencies
        - mood or treatment
        - graphic treatment traits
      not_required_for:
        - BRAND_CONFIRMED explicit visual constraints
      numeric_percentage_required: false

    maturity:
      B:
        visual_style_profile_required: false
        recognition_asset_path: existing Identity brand_logo compatibility
      D:
        canonical_visual_refs_may_be_available: true
        partial_visual_style_profile_may_be_useful_when_grounded: true
      E:
        richer_canonical_visual_state_expected_when_available: true
        richer_visual_style_profile_may_mature_asynchronously: true
      completion_blocks:
        Brand_Preview: false
        verification: false
        Home: false

    industry_policy:
      common_schema_across: [D2C, SAAS_AI, HEALTHCARE, OFFLINE_SERVICES]
      separate_industry_schemas: false
      D2C:
        likely_emphasis: [packaging, product imagery, lifestyle imagery]
      SAAS_AI:
        likely_emphasis: [product UI, screenshots, technical visual treatment]
      HEALTHCARE:
        likely_emphasis: [clinic imagery, expert imagery, trust presentation]
        medical_efficacy_or_professional_claim_inference_from_aesthetics: forbidden
      OFFLINE_SERVICES:
        likely_emphasis: [venue imagery, experience imagery, ambience]
      irrelevant_categories_required: false

    downstream_consumers:
      - Brand_Centre
      - Chat
      - Campaign_Brief
      - Creator_Strategy
      - creator_visual_guidance
      - future_creative_generation
      - future_Brand_consistency_evaluation
      - Product_Intelligence_where_useful

    non_owned_campaign_semantics:
      - creative concept
      - shot list
      - deliverables
      - CTA
      - campaign visual direction

    persistence_target_classification: DERIVED_INTELLIGENCE_STORAGE_REQUIRED

persistence_classification_vocabulary:
  - CANONICAL_BUSINESS_STATE_REFERENCE
  - DERIVED_INTELLIGENCE_STORAGE_REQUIRED
  - PERSISTENCE_RECONCILIATION_REQUIRED

validation_invariants:
  - Exactly one durable Visual Identity Intelligence Object is defined.
  - The only durable Object is visual_style_profile.
  - Logo, palette, typography and reference-image records are not duplicated as Intelligence Objects.
  - Observed visual signals remain normalized Evidence or transient candidate state until accepted into canonical visual business state where applicable.
  - Descriptive visual interpretation and explicit Brand visual constraints are separate semantics.
  - CREATOR_SHOP_DERIVED or OBSERVED descriptive patterns cannot become hard visual constraints automatically.
  - Hard visual constraints require BRAND_CONFIRMED authority or another explicitly accepted future Product authority.
  - Structured list items have stable semantic identity and item/subfield-level authority where independently protectable.
  - Derivation dependencies and protected current authoritative state are separately represented.
  - Existing Identity brand_logo remains COMPATIBILITY_ONLY and unchanged.
  - visual_style_profile is not required for Brand Preview, verification or Home.
  - Invalidation is directed and does not require unrelated Brand Intelligence reruns.
  - Active Campaign creative instructions are not silently rewritten.
  - Overall Brand Intelligence topology remains PROVISIONAL.
  - Persistence implementation is not defined here.
