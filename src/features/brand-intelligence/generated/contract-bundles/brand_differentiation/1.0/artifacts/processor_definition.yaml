version: '1.0'
status: FROZEN
owner_engine: brand_intelligence
shared_runtime_dependencies:
- Compiler
- Prompt Builder
- Model Registry
- provider port
- Safe YAML loader
- telemetry
- generic persistence adapter
shared_authority_rules:
  processors_may_emit:
  - OBSERVED
  - CREATOR_SHOP_DERIVED
  - SYSTEM_DERIVED
  processors_must_not_emit:
  - BRAND_CONFIRMED
  - SUPPORT_CONTROLLED
  brand_confirmation_transition_owner: authorized_application_or_business_state_action
  protected_current_authoritative_state:
    ordinary_derivation_dependency: false
    silent_overwrite: forbidden
    new_evidence_behavior: compare_or_surface_discrepancy_without_automatic_replacement
shared_readiness_rules:
  partial_valid_output_supported: true
  no_brand_preview_gate: true
  no_verification_gate: true
  no_home_gate: true
  no_filler_to_force_ready: true
  consumer_scoped_readiness: true
shared_invalidation_rules:
  directed_only: true
  whole_brand_intelligence_recompute: forbidden
id: brand_differentiation
owning_branch: brand_expression
processor_type: AI_REASONING
purpose: Produce Brand-level strategic differentiators paired with factual support while preserving distinct authority for derived differentiator interpretation and observed proof.
outputs:
- differentiation_and_proof
canonical_inputs:
- brand_name
- website_url
- confirmed_industry
- confirmed_sub_industry_or_category
- canonical Offering facts when relevant
evidence_requirements:
- owned_website.brand_company_context
- owned_website.brand_messaging
- owned_website.offering_context
- explicit factual proof or claim Evidence
optional_enrichment: []
authority_behavior:
  differentiator_default: CREATOR_SHOP_DERIVED
  proof_point_default_when_directly_evidenced: OBSERVED
  mixed_authority_required: true
  proof_does_not_inherit_differentiator_authority: true
  observed_proof_does_not_make_strategic_differentiator_objectively_true: true
  aggregate_brand_confirmation_emitted_by_processor: false
partial_output_behavior:
  object_nullable: true
  partial_records_allowed: true
  unsupported_differentiation: null_or_omit_not_invent
  proof_points_may_be_absent_when_not_defensible: true
readiness_contribution:
  Brand_Centre: PARTIAL_ALLOWED
  Chat: IMPORTANT_CONTEXT_WHEN_AVAILABLE
  Creator_Strategy: IMPORTANT_CONTEXT_WHEN_AVAILABLE
  Campaign_Brief: IMPORTANT_CONTEXT_WHEN_AVAILABLE
refresh_triggers:
- material Brand-level proof evidence change
- material Brand proposition or differentiator evidence change
- explicit Brand edit affecting differentiators or proof
invalidation_rules:
  proof_item_may_stale_independently: true
  proof_change_may_trigger_parent_differentiator_reevaluation: true
  affected_items_only: true
model_profile_requirement_class: structured_grounded_reasoning_with_claim_safety
validation_responsibility:
- validate stable differentiator and proof item identities
- enforce mixed authority semantics
- reject unsupported leadership/performance/efficacy claims
- apply stricter Healthcare unsupported-claim protection
- prevent inference of clinical efficacy from marketing copy
- exclude Offering-specific feature/claim/proof ownership
persistence_boundary: Processor defines structured mixed-authority semantics; persistence is deferred.
non_owned_scope:
- Offering-specific features
- Offering-specific claims
- Offering-specific advantages
- Offering-specific proof
- competitor ranking
- Campaign claims
- canonical Offering truth
migration_relevance:
  legacy_identity_dependency: none_direct
  identity_core_retirement: does_not_by_itself_make_identity_core_retireable
