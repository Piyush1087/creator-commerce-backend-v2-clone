canonical_authority:
  creator_context: CreatorCanonicalContextService
  state_projection: CreatorEntryStateService
  platform_guard: CreatorPlatformAccessGuard
  stable_instagram_identity: CreatorSocialIntegration.nativePlatformUserId
  redirect_source: CREATOR_INSTAGRAM_REDIRECT_URI_EXACT_ALLOWLIST
  oauth_persistence: CreatorInstagramOAuthTransactionService_OVER_ProviderOAuthTransactionService

revalidation_contract:
  route: POST_/api/v1/creator-entry/instagram/revalidate
  authentication: JWT_AUTHENTICATED_CANONICAL_CREATOR
  existing_stable_identity_required: true
  explicitly_disconnected_credential_used: false
  provider_sequence:
    - INSTAGRAM_ME
    - SAME_STABLE_USER_ID
    - PROFESSIONAL_ACCOUNT
    - INSTAGRAM_ME_PERMISSIONS
  username: MUTABLE_METADATA_NOT_IDENTITY
  generation_increment: false
  credential_version_increment: false
  media_or_intelligence_reads: NONE

refresh_contract:
  provider_operation: InstagramOAuthClient.refreshLongLivedToken
  credential: ENCRYPTED_LONG_LIVED_ACCESS_TOKEN
  minimum_token_age: 24_HOURS
  expiry_window: 7_DAYS
  timing_authority: SHARED_INSTAGRAM_TOKEN_LIFECYCLE_CONSTANTS
  expired_token_refresh_attempt: FORBIDDEN
  stable_identity_change: FORBIDDEN
  successful_credential_version_increment: 1
  successful_authorization_generation_increment: 0
  fences:
    - integration_id
    - stable_provider_identity
    - authorization_generation
    - credential_version
    - active_token_state
    - not_disconnected

scheduler_contract:
  mechanism: NEST_SCHEDULE_CRON
  cadence: DAILY_AT_03_00_SERVER_TIME
  cron: "0 0 3 * * *"
  bounded_batch_size: 50
  overlapping_callback: WAIT_FOR_COMPLETION
  one_candidate_failure_aborts_batch: false
  logs_plaintext_token_code_or_state: false

reconnect_authorize:
  route: POST_/api/v1/creator-entry/instagram/reconnect/authorize
  authentication: JWT_AUTHENTICATED_CANONICAL_CREATOR
  request_security_context: NONE
  intent: RECONNECT
  bindings:
    - initiating_user
    - creator_profile
    - server_redirect_uri
    - expected_authorization_generation
    - expected_stable_provider_account_id
  existing_stable_identity_required: true

reconnect_complete:
  route: POST_/api/v1/creator-entry/instagram/reconnect/complete
  authentication: JWT_AUTHENTICATED_CANONICAL_CREATOR
  accepted_request:
    - STATE_AND_CODE
    - STATE_ERROR_AND_OPTIONAL_DESCRIPTION
  state_consumed_before_provider_io: true
  provider_sequence:
    - SHORT_TO_LONG_TOKEN_EXCHANGE
    - INSTAGRAM_ME
    - PROFESSIONAL_ACCOUNT
    - SAME_STABLE_USER_ID
    - PERMISSIONS
    - ATOMIC_PROMOTION
  authorization_generation_increment: 1
  credential_version_increment: 1

same_identity_fencing:
  provider_me_user_id_must_equal_expected: true
  different_identity: INSTAGRAM_IDENTITY_CONFLICT
  native_platform_user_id_overwrite: FORBIDDEN
  provider_identity_transfer: FORBIDDEN

disconnect_reconciliation:
  canonical_route: DELETE_/api/v1/creator/settings/social/INSTAGRAM
  stable_identity_retained: true
  metadata_retained_as_history: true
  token_state: REVOKED
  authorization_health: DISCONNECTED
  basic_capability: UNAVAILABLE
  insights_capability: UNAVAILABLE
  disconnected_at: SET
  reason_code: USER_DISCONNECTED
  ciphertext: RETAINED_BECAUSE_SCHEMA_FIELD_IS_REQUIRED
  revoked_ciphertext_runtime_reuse: FORBIDDEN

generation_fencing:
  disconnect_authorization_generation_increment: 1
  disconnect_credential_version_increment: 1
  reconnect_requires_expected_generation_and_provider_id: true
  stale_pre_disconnect_state: INSTAGRAM_AUTHORIZATION_STALE
  concurrent_reconnect: EXACTLY_ONE_WINNER

state_recovery_actions:
  no_identity: CONNECT_INSTAGRAM
  connected_reauthorization_required: RECONNECT_INSTAGRAM
  disconnected: RECONNECT_INSTAGRAM
  connected_unknown: REVALIDATE_INSTAGRAM
  provider_access_blocked: REVALIDATE_INSTAGRAM
  usable_basic: CREATOR_WORKSPACE_ENTRY

platform_guard_behavior:
  provider_calls: NONE
  lazy_repair: NONE
  allow_formula: CONNECTED_AND_BASIC_AVAILABLE_AND_HEALTH_USABLE
  insights_gate: false
  expired_denied: true
  disconnected_denied: true
  provider_blocked_denied: true
  recovery_routes_guarded_by_platform_guard: false

provider_failure_transitions:
  TRANSIENT_OR_UNKNOWN:
    state_mutation: NONE
    outcome: INSTAGRAM_PROVIDER_RETRY_REQUIRED
  AUTHORIZATION_REVALIDATION_REQUIRED_OR_PERMISSION_LOSS:
    stable_identity: RETAINED
    basic: UNAVAILABLE
    insights: UNKNOWN
    health: REAUTHORIZATION_REQUIRED
  PROVIDER_ACCESS_BLOCKED:
    stable_identity: RETAINED
    basic: RETAIN_STRONGEST_KNOWN_EVIDENCE
    health: PROVIDER_ACCESS_BLOCKED
  EXPIRED:
    stable_identity: RETAINED
    token_state: EXPIRED
    basic: UNAVAILABLE
    insights: UNKNOWN
    health: REAUTHORIZATION_REQUIRED
    reason_code: TOKEN_EXPIRED

