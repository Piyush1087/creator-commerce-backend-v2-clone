  pending: RETAIN_COOKIE_AND_SERVER_REFERENCE
  ready: SHORTEN_COOKIE_TO_MINIMUM_OF_ORIGINAL_EXPIRY_AND_10_MINUTES
  expired_or_unknown: CLEAR_COOKIE
  identity_conflict: RETAIN_COOKIE

idempotency_contract:
