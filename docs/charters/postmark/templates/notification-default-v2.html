<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <title>{{title}}</title>
    <style type="text/css" rel="stylesheet" media="all">
      @import url("https://fonts.googleapis.com/css?family=Nunito+Sans:400,700&display=swap");
      body { width: 100% !important; height: 100%; margin: 0; -webkit-text-size-adjust: none; background-color: #F2F4F6; color: #51545E; }
      a { color: #3869D4; }
      a img { border: none; }
      td { word-break: break-word; }
      body, td, th { font-family: "Nunito Sans", Helvetica, Arial, sans-serif; }
      h1 { margin-top: 0; color: #333333; font-size: 22px; font-weight: bold; text-align: left; }
      td, th { font-size: 16px; }
      p { margin: .4em 0 1.1875em; font-size: 16px; line-height: 1.625; color: #51545E; }
      p.sub { font-size: 13px; }
      .button {
        background-color: #3869D4;
        border-top: 10px solid #3869D4;
        border-right: 18px solid #3869D4;
        border-bottom: 10px solid #3869D4;
        border-left: 18px solid #3869D4;
        display: inline-block;
        color: #FFF;
        text-decoration: none;
        border-radius: 3px;
        box-shadow: 0 2px 3px rgba(0, 0, 0, 0.16);
        -webkit-text-size-adjust: none;
        box-sizing: border-box;
      }
      @media only screen and (max-width: 500px) {
        .button { width: 100% !important; text-align: center !important; }
      }
      .email-wrapper { width: 100%; margin: 0; padding: 0; background-color: #F2F4F6; }
      .email-content { width: 100%; margin: 0; padding: 0; }
      .email-masthead { padding: 25px 0; text-align: center; }
      .email-body { width: 100%; margin: 0; padding: 0; }
      .email-body_inner { width: 570px; margin: 0 auto; padding: 0; background-color: #FFFFFF; }
      .email-footer { width: 570px; margin: 0 auto; padding: 0; text-align: center; }
      .email-footer p { color: #A8AAAF; }
      .body-action { width: 100%; margin: 30px auto; padding: 0; text-align: center; }
      .body-sub { margin-top: 25px; padding-top: 25px; border-top: 1px solid #EAEAEC; }
      .content-cell { padding: 45px; }
      @media only screen and (max-width: 600px) {
        .email-body_inner, .email-footer { width: 100% !important; }
      }
      @media (prefers-color-scheme: dark) {
        body, .email-body, .email-body_inner, .email-content, .email-wrapper, .email-masthead, .email-footer {
          background-color: #333333 !important; color: #FFF !important;
        }
        p, h1, span { color: #FFF !important; }
      }
    </style>
  </head>
  <body>
    <table class="email-wrapper" width="100%" cellpadding="0" cellspacing="0" role="presentation">
      <tr>
        <td align="center">
          <table class="email-content" width="100%" cellpadding="0" cellspacing="0" role="presentation">
            <tr>
              <td class="email-masthead">
                <a href="https://thecreatorshop.in" target="_blank">
                  <img
                    src="https://stratus.campaign-image.in/images/252780000000136109_zc_v1_1759554983059_creator_shop_white_logo.png.png"
                    alt="The Creator Shop"
                    width="150"
                    style="display: block; margin: 0 auto 10px auto; border: 0;"
                  />
                </a>
              </td>
            </tr>
            <tr>
              <td class="email-body" width="570" cellpadding="0" cellspacing="0">
                <table class="email-body_inner" align="center" width="570" cellpadding="0" cellspacing="0" role="presentation">
                  <tr>
                    <td class="content-cell">
                      <div class="f-fallback">
                        <h1>{{title}}</h1>
                        <p>Hi {{name}},</p>
                        <p>{{body}}</p>
                        <table class="body-action" align="center" width="100%" cellpadding="0" cellspacing="0" role="presentation">
                          <tr>
                            <td align="center">
                              <table border="0" cellspacing="0" cellpadding="0">
                                <tr>
                                  <td>
                                    <a href="{{action_url}}" class="button" target="_blank">Open</a>
                                  </td>
                                </tr>
                              </table>
                            </td>
                          </tr>
                        </table>
                        <p>Thanks,<br />The Creator Shop Team</p>
                        <table class="body-sub" role="presentation">
                          <tr>
                            <td>
                              <p class="sub">If the button does not work, copy and paste this URL into your browser:</p>
                              <p class="sub"><a href="{{action_url}}">{{action_url}}</a></p>
                              <p class="sub">Event: {{event_type}}</p>
                            </td>
                          </tr>
                        </table>
                      </div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td>
                <table class="email-footer" align="center" width="570" cellpadding="0" cellspacing="0" role="presentation">
                  <tr>
                    <td class="content-cell" align="center">
                      <p class="f-fallback sub align-center">&copy; 2026 The Creator Shop. All rights reserved.</p>
                      <p class="f-fallback sub align-center">GrowthVerse</p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
