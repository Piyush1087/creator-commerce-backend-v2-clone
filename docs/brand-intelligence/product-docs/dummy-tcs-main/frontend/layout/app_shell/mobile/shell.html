<script>
        const menuTrigger = document.getElementById('menu-trigger');
        const closeDrawer = document.getElementById('close-drawer');
        const sideDrawer = document.getElementById('side-drawer');
        const drawerBackdrop = document.getElementById('drawer-backdrop');

        function toggleDrawer() {
            const isOpen = sideDrawer.classList.contains('translate-x-0');
            if (isOpen) {
                sideDrawer.classList.replace('translate-x-0', 'translate-x-full');
                drawerBackdrop.classList.add('hidden');
            } else {
                sideDrawer.classList.replace('translate-x-full', 'translate-x-0');
                drawerBackdrop.classList.remove('hidden');
            }
        }

        menuTrigger.addEventListener('click', toggleDrawer);
        closeDrawer.addEventListener('click', toggleDrawer);
        drawerBackdrop.addEventListener('click', toggleDrawer);

        // Micro-interaction for cards
        document.querySelectorAll('.active\\:scale-\\[0\\.98\\]').forEach(card => {
            card.addEventListener('touchstart', () => {
                card.style.transform = 'scale(0.98)';
            });
            card.addEventListener('touchend', () => {
                card.style.transform = 'scale(1)';
            });
        });
    </script>
