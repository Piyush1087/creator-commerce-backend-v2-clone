name: DE W1.0A Exact Prettier

on:
  push:
    branches:
      - temp/de-w1-0a-prettier-exact

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore: apply exact DE prettier'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prettier --write "src/features/data-extraction/evidence/**/*.ts"
      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/data-extraction/evidence
          if git diff --cached --quiet; then
            echo "No formatter changes"
          else
            git commit -m "chore: apply exact DE prettier"
            git push
          fi
