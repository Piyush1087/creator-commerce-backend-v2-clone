name: DE W1.0A Temporary Validation

on:
  push:
    branches:
      - temp/de-w1-0a-validation-a7c8f3a8

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Capture eslint diagnostics
        run: npx eslint "src/features/data-extraction/evidence/**/*.ts" --format json > de-lint.json || true
      - name: Capture exact prettier patch
        run: |
          npx prettier --write "src/features/data-extraction/evidence/**/*.ts"
          git diff -- src/features/data-extraction/evidence > prettier.patch
      - uses: actions/upload-artifact@v4
        with:
          name: de-w1-0a-diagnostics
          path: |
            de-lint.json
            prettier.patch
          if-no-files-found: error
