name: Phase F4 Migration Diff

on:
  push:
    branches:
      - phase-f4-migration-artifact

jobs:
  generate-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://user:password@127.0.0.1:5432/unused
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write baseline schema
        run: git show b8360dfd0cd9ea5d326ec5890e2139c9b9975281:prisma/schema.prisma > /tmp/baseline-schema.prisma

      - name: Validate current schema
        run: npx prisma validate

      - name: Generate migration SQL diff
        run: npx prisma migrate diff --from-schema /tmp/baseline-schema.prisma --to-schema prisma/schema.prisma --script --output /tmp/consolidated-schema.sql

      - name: Generate human-readable diff
        run: npx prisma migrate diff --from-schema /tmp/baseline-schema.prisma --to-schema prisma/schema.prisma > /tmp/consolidated-schema-summary.txt

      - name: Copy artifacts
        run: |
          mkdir -p phase-f4-artifact
          cp /tmp/consolidated-schema.sql phase-f4-artifact/migration.sql
          cp /tmp/consolidated-schema-summary.txt phase-f4-artifact/diff-summary.txt
          printf '%s\n' 'Baseline: b8360dfd0cd9ea5d326ec5890e2139c9b9975281' > phase-f4-artifact/README.txt
          printf '%s\n' "Target: $GITHUB_SHA" >> phase-f4-artifact/README.txt
          printf '%s\n' 'Generated by prisma migrate diff only. No database connection or migration application.' >> phase-f4-artifact/README.txt

      - name: Upload migration artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase-f4-consolidated-schema-diff
          path: phase-f4-artifact
          if-no-files-found: error
