name: Phase F4 Migration Diff

on:
  push:
    branches:
      - phase-f4-migration-artifact

permissions:
  contents: write

jobs:
  generate-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://user:password@127.0.0.1:5432/unused
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write baseline schema
        run: git show b8360dfd0cd9ea5d326ec5890e2139c9b9975281:prisma/schema.prisma > /tmp/baseline-schema.prisma

      - name: Validate current schema
        run: npx prisma validate

      - name: Generate migration SQL diff
        run: npx prisma migrate diff --from-schema-datamodel /tmp/baseline-schema.prisma --to-schema-datamodel prisma/schema.prisma --script --output /tmp/consolidated-schema.sql

      - name: Generate human-readable diff
        run: npx prisma migrate diff --from-schema-datamodel /tmp/baseline-schema.prisma --to-schema-datamodel prisma/schema.prisma > /tmp/consolidated-schema-summary.txt

      - name: Audit generated SQL
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/consolidated-schema.sql')
          sql = p.read_text()
          destructive = '''ALTER TABLE "uce_campaign_targeting" ADD COLUMN     "audience_affinity_ids" TEXT[] DEFAULT ARRAY[]::TEXT[],
          ADD COLUMN     "audience_geographies" JSONB NOT NULL DEFAULT '[]',
          ADD COLUMN     "maximum_followers" INTEGER,
          ADD COLUMN     "minimum_followers" INTEGER NOT NULL DEFAULT 0,
          DROP COLUMN "audience_gender",
          ADD COLUMN     "audience_gender" "UceAudienceGender" NOT NULL DEFAULT 'ALL';'''
          safe = '''ALTER TABLE "uce_campaign_targeting" ADD COLUMN     "audience_affinity_ids" TEXT[] DEFAULT ARRAY[]::TEXT[],
          ADD COLUMN     "audience_geographies" JSONB NOT NULL DEFAULT '[]',
          ADD COLUMN     "maximum_followers" INTEGER,
          ADD COLUMN     "minimum_followers" INTEGER NOT NULL DEFAULT 0;

          -- Preserve legacy audience_gender values while moving String -> enum.
          -- Unexpected legacy values intentionally fail rather than being silently coerced.
          ALTER TABLE "uce_campaign_targeting"
          ALTER COLUMN "audience_gender" DROP DEFAULT,
          ALTER COLUMN "audience_gender" TYPE "UceAudienceGender"
          USING ("audience_gender"::"UceAudienceGender"),
          ALTER COLUMN "audience_gender" SET DEFAULT 'ALL';'''
          if destructive not in sql:
              raise SystemExit('Expected audience_gender generated block not found; stop for manual review.')
          sql = sql.replace(destructive, safe)

          asset_table = '''CREATE TABLE "uce_campaign_assets" (
              "id" TEXT NOT NULL,
              "campaign_id" TEXT NOT NULL,
              "kind" "UceCampaignAssetKind" NOT NULL,
              "status" "UceCampaignAssetStatus" NOT NULL DEFAULT 'ACTIVE',
              "brand_profile_id" TEXT,
              "offering_id" TEXT,
              "brand_offer_id" TEXT,
              "created_at" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
              "updated_at" TIMESTAMP(3) NOT NULL,

              CONSTRAINT "uce_campaign_assets_pkey" PRIMARY KEY ("id")
          );'''
          asset_table_checked = '''CREATE TABLE "uce_campaign_assets" (
              "id" TEXT NOT NULL,
              "campaign_id" TEXT NOT NULL,
              "kind" "UceCampaignAssetKind" NOT NULL,
              "status" "UceCampaignAssetStatus" NOT NULL DEFAULT 'ACTIVE',
              "brand_profile_id" TEXT,
              "offering_id" TEXT,
              "brand_offer_id" TEXT,
              "created_at" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
              "updated_at" TIMESTAMP(3) NOT NULL,

              CONSTRAINT "uce_campaign_assets_pkey" PRIMARY KEY ("id"),
              CONSTRAINT "uce_campaign_assets_exactly_one_reference_check" CHECK (
                ("kind" = 'BRAND' AND "brand_profile_id" IS NOT NULL AND "offering_id" IS NULL AND "brand_offer_id" IS NULL) OR
                ("kind" = 'OFFERING' AND "brand_profile_id" IS NULL AND "offering_id" IS NOT NULL AND "brand_offer_id" IS NULL) OR
                ("kind" = 'OFFER' AND "brand_profile_id" IS NULL AND "offering_id" IS NULL AND "brand_offer_id" IS NOT NULL)
              )
          );'''
          if asset_table not in sql:
              raise SystemExit('Expected Campaign Asset table block not found; stop for manual review.')
          sql = sql.replace(asset_table, asset_table_checked)

          header = '''-- Phase F4 consolidated pre-production migration artifact.
          -- Baseline schema commit: b8360dfd0cd9ea5d326ec5890e2139c9b9975281
          -- Target consolidated runtime/schema commit: 7e346185b009f618bbfc02c3c8cbae143c10e1fe
          -- Generated from Prisma schema-to-schema diff and safety-audited before database use.
          -- DEV/PRE-PRODUCTION ONLY. Production requires independent data/backfill review.

          '''
          Path('prisma/migrations/20260813005000_consolidated_preprod').mkdir(parents=True, exist_ok=True)
          Path('prisma/migrations/20260813005000_consolidated_preprod/migration.sql').write_text(header + sql)
          PY

      - name: Write F4 audit record
        run: |
          mkdir -p docs/database
          cat > docs/database/consolidated_schema_migration_f4_audit.md <<'EOF'
          # Phase F4 — Consolidated Schema Migration Audit

          ## Scope
          Baseline: `b8360dfd0cd9ea5d326ec5890e2139c9b9975281`

          Target schema/runtime authority: `7e346185b009f618bbfc02c3c8cbae143c10e1fe`

          This migration is a **dev/pre-production artifact**. It is not approved for direct production application.

          ## Generated migration profile
          The Prisma schema diff is additive overall: new Campaign/Collaboration canonical enums, tables, columns, indexes, and foreign keys are introduced while legacy Product/Brief/Collaboration/reporting structures remain present.

          ## Safety corrections applied in F4
          1. Prisma generated a destructive drop/re-add for `uce_campaign_targeting.audience_gender` while changing String → enum. F4 replaces that with an in-place explicit enum cast so existing values are preserved. Unexpected historical values intentionally fail for manual review rather than being silently coerced.
          2. Added the database-level `uce_campaign_assets_exactly_one_reference_check` required by the canonical Campaign Asset contract.

          ## Deliberately retained migration debt
          - Existing Campaign × Creator Collaboration uniqueness remains in place during this transitional migration. `source_application_id` is added and unique, but removal of the old uniqueness constraint waits for lineage/backfill review.
          - Canonical Application Asset/Brief foreign keys are nullable; no legacy Product/Brief ID is copied into a canonical FK.
          - Collaboration canonical Asset/Brief references are nullable for the same reason.
          - Existing Campaign rows receive compatibility defaults for newly added canonical fields. These defaults are not evidence that historic records were semantically backfilled.
          - Existing Collaboration rows receive compatibility defaults for canonical lifecycle/stage fields. Historic stage/lifecycle backfill remains separate work.
          - Legacy Campaign Product/Brief, reporting snapshots, UCE Collaboration, legacy Collaboration children, Escrow and payout structures are not dropped.
          - No historical Product → Offering/Offer mapping is fabricated.
          - No financial ledger, escrow balance, payout evidence, or settlement history is rewritten.

          ## F5 rule
          Apply this migration first only to a safe dev/test PostgreSQL target. Before production migration, the developer must independently inspect real data, lineage, legacy enum values, backfill requirements, constraint timing, and financial records.
          EOF

      - name: Copy artifacts
        run: |
          mkdir -p phase-f4-artifact
          cp prisma/migrations/20260813005000_consolidated_preprod/migration.sql phase-f4-artifact/migration.sql
          cp /tmp/consolidated-schema-summary.txt phase-f4-artifact/diff-summary.txt
          cp docs/database/consolidated_schema_migration_f4_audit.md phase-f4-artifact/audit.md
          printf '%s\n' 'Baseline: b8360dfd0cd9ea5d326ec5890e2139c9b9975281' > phase-f4-artifact/README.txt
          printf '%s\n' 'Target schema/runtime: 7e346185b009f618bbfc02c3c8cbae143c10e1fe' >> phase-f4-artifact/README.txt
          printf '%s\n' 'No database connection or migration application occurred.' >> phase-f4-artifact/README.txt

      - name: Upload migration artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase-f4-consolidated-schema-diff
          path: phase-f4-artifact
          if-no-files-found: error

      - name: Publish audited migration files to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations/20260813005000_consolidated_preprod/migration.sql docs/database/consolidated_schema_migration_f4_audit.md
          if git diff --cached --quiet; then
            echo "No migration artifact changes to publish."
            exit 0
          fi
          git commit -m "F4 publish audited migration artifact"
          git push origin HEAD:phase-f4-migration-artifact
