        run: |
          timeout 3m sh -c '
            npm run start:prod >/tmp/c03-p11e-api.log 2>&1 &
            api_pid=$!
            trap "kill $api_pid 2>/dev/null || true" EXIT
            for attempt in $(seq 1 60); do
              if curl --fail --silent http://127.0.0.1:3303/ >/tmp/c03-p11e-root.json; then exit 0; fi
              if ! kill -0 "$api_pid" 2>/dev/null; then break; fi
              sleep 1
            done
            sed -n "1,240p" /tmp/c03-p11e-api.log
            exit 1
          '

      - name: Upload runtime acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: c03-p11e-runtime-${{ github.sha }}
          path: |
            /tmp/c03-p11e-focused.log
            /tmp/c03-p11e-full-tests.log
            /tmp/c03-p11e-build.log
            /tmp/c03-p11e-api.log
            /tmp/c03-p11e-root.json
          if-no-files-found: error
          retention-days: 30

      - name: Final repository and authority integrity
        run: |
          test "$(git merge-base ab8d1c022ae165846a40a8737f163bdb5ba7d65c HEAD)" = "ab8d1c022ae165846a40a8737f163bdb5ba7d65c"
          git diff --exit-code ab8d1c022ae165846a40a8737f163bdb5ba7d65c -- prisma/schema.prisma prisma/migrations
          git diff --exit-code
          test -z "$(git status --porcelain)"
