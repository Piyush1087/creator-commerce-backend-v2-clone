name: C03 Recovery Block 1

on:
  push:
    branches:
      - c03/recovery-campaign-participation-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c03-recovery-block-1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  p11b-application-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: c03_recovery
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d c03_recovery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      STAGE: local
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/c03_recovery?schema=public
      CHECKPOINT_DISABLE: "1"
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Recovery authority and P1.1A identity
        run: |
          expected_p0=6a2bd2e4b815462abc702dea34f7c368c24a0664
          expected_p11a=7da499a0c0a9c12c8c4247dd4567726990ae8120
          original=$(git ls-remote origin refs/heads/c03/campaign-participation-v1 | cut -f 1)
          test "$original" = "$expected_p0"
          test "$(git merge-base "$expected_p11a" HEAD)" = "$expected_p11a"
          test "$(git rev-list --merges "$expected_p11a"..HEAD --count)" = "0"
          test -z "$(git status --porcelain)"
          test "$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" = "76"
          node --version
          npm --version
          echo "p0=$expected_p0"
          echo "p11a=$expected_p11a"
          echo "candidate=$(git rev-parse HEAD)"
          echo "tree=$(git rev-parse HEAD^{tree})"

      - name: Locked install and Prisma 6.19 static validation
        run: |
          timeout 15m npm ci
          test "$(node -p "require('./node_modules/prisma/package.json').version")" = "6.19.3"
          timeout 10m npm run prisma:generate
          timeout 5m node node_modules/prisma/build/index.js format --check
          timeout 5m node node_modules/prisma/build/index.js validate

      - name: Fresh PostgreSQL 0-to-76 replay
        run: |
          PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres c03_p11b_fresh
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/c03_p11b_fresh?schema=public timeout 20m npm run db:migrate:deploy
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/c03_p11b_fresh?schema=public timeout 20m node node_modules/prisma/build/index.js migrate status
          count=$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d c03_p11b_fresh -Atc "select count(*) from _prisma_migrations where finished_at is not null and rolled_back_at is null")
          test "$count" = "76"

      - name: Seeded exact P0 74-to-76 upgrade
        run: |
          PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres c03_p11b_upgrade74
          git worktree add --detach /tmp/c03-p0-base 6a2bd2e4b815462abc702dea34f7c368c24a0664
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/c03_p11b_upgrade74?schema=public timeout 20m node node_modules/prisma/build/index.js migrate deploy --schema=/tmp/c03-p0-base/prisma/schema.prisma
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/c03_p11b_upgrade74?schema=public timeout 5m node scripts/c03-p11b-seed-legacy-applications.mjs
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/c03_p11b_upgrade74?schema=public timeout 10m node scripts/c03-p11-preflight.mjs | tee /tmp/c03-p11b-preflight.json
          test "$(jq -r .result /tmp/c03-p11b-preflight.json)" = "PASS"
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d c03_p11b_upgrade74 -At -F '|' -c "select a.id, a.status::text, md5(concat_ws('|', s.campaign_context::text, s.campaign_asset_context::text, s.brief_context::text, s.commercial_context::text, s.creator_identity::text)) from uce_applications a join uce_application_snapshots s on s.application_id = a.id order by a.id" > /tmp/c03-p11b-snapshots-74-before.txt
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/c03_p11b_upgrade74?schema=public timeout 20m npm run db:migrate:deploy
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/c03_p11b_upgrade74?schema=public timeout 20m node node_modules/prisma/build/index.js migrate status
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d c03_p11b_upgrade74 -At -F '|' -c "select a.id, a.status::text, md5(concat_ws('|', s.campaign_context::text, s.campaign_asset_context::text, s.brief_context::text, s.commercial_context::text, s.creator_identity::text)) from uce_applications a join uce_application_snapshots s on s.application_id = a.id order by a.id" > /tmp/c03-p11b-snapshots-74-after.txt
          diff -u /tmp/c03-p11b-snapshots-74-before.txt /tmp/c03-p11b-snapshots-74-after.txt
          preserved=$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d c03_p11b_upgrade74 -Atc "select count(*) from uce_applications where authority_version = 'LEGACY_COMPATIBILITY' and status_version = 0 and brand_profile_id is null and canonical_campaign_asset_id is null and canonical_brief_id is null and subject_creator_profile_id is null and subject_creator_workspace_id is null and actor_user_id is null and actor_membership_id is null and actor_role is null and campaign_invitation_id is null and first_qualified_touch_id is null and conversion_touch_id is null and terminal_at is null")
          test "$preserved" = "6"
          statuses=$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d c03_p11b_upgrade74 -Atc "select count(distinct status) from uce_applications")
          test "$statuses" = "6"
          unversioned=$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d c03_p11b_upgrade74 -Atc "select count(*) from uce_application_snapshots where schema_version is null and actor_context is null and attribution_context is null")
          test "$unversioned" = "6"

      - name: Seeded P1.1A 75-to-76 upgrade
        run: |
          PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres c03_p11b_upgrade75
          git worktree add --detach /tmp/c03-p11a-base 7da499a0c0a9c12c8c4247dd4567726990ae8120
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/c03_p11b_upgrade75?schema=public timeout 20m node node_modules/prisma/build/index.js migrate deploy --schema=/tmp/c03-p11a-base/prisma/schema.prisma
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/c03_p11b_upgrade75?schema=public timeout 5m node scripts/c03-p11b-seed-legacy-applications.mjs
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d c03_p11b_upgrade75 -At -F '|' -c "select a.id, a.status::text, md5(concat_ws('|', s.campaign_context::text, s.campaign_asset_context::text, s.brief_context::text, s.commercial_context::text, s.creator_identity::text)) from uce_applications a join uce_application_snapshots s on s.application_id = a.id order by a.id" > /tmp/c03-p11b-snapshots-75-before.txt
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/c03_p11b_upgrade75?schema=public timeout 20m npm run db:migrate:deploy
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/c03_p11b_upgrade75?schema=public timeout 20m node node_modules/prisma/build/index.js migrate status
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d c03_p11b_upgrade75 -At -F '|' -c "select a.id, a.status::text, md5(concat_ws('|', s.campaign_context::text, s.campaign_asset_context::text, s.brief_context::text, s.commercial_context::text, s.creator_identity::text)) from uce_applications a join uce_application_snapshots s on s.application_id = a.id order by a.id" > /tmp/c03-p11b-snapshots-75-after.txt
          diff -u /tmp/c03-p11b-snapshots-75-before.txt /tmp/c03-p11b-snapshots-75-after.txt
          preserved=$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d c03_p11b_upgrade75 -Atc "select count(*) from uce_applications where authority_version = 'LEGACY_COMPATIBILITY' and status_version = 0")
          test "$preserved" = "6"

      - name: P1.1B real PostgreSQL negative invariants
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/c03_p11b_fresh?schema=public
          C03_P11B_DATABASE_TEST: "true"
        run: |
          timeout 20m node node_modules/vitest/vitest.mjs run --config vitest.config.ts src/features/brand-uce/persistence/c03-p11b-application-snapshot.postgres.test.ts

      - name: Legacy Brand Application compatibility tests
        run: |
          timeout 30m node node_modules/vitest/vitest.mjs run --config vitest.config.ts \
            src/features/brand-uce/services/campaign-application.service.test.ts \
            src/features/brand-uce/services/campaign-query.service.test.ts

      - name: Full tests and production build
        run: |
          timeout 45m npm test
          timeout 20m npm run build

      - name: Upload P1.1B upgrade evidence
        uses: actions/upload-artifact@v4
        with:
          name: c03-p11b-upgrade-${{ github.sha }}
          path: |
            /tmp/c03-p11b-preflight.json
            /tmp/c03-p11b-snapshots-74-before.txt
            /tmp/c03-p11b-snapshots-74-after.txt
            /tmp/c03-p11b-snapshots-75-before.txt
            /tmp/c03-p11b-snapshots-75-after.txt
          if-no-files-found: error
          retention-days: 30

      - name: Final repository integrity
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
