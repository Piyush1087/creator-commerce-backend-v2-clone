name: DE-W1.0C format
on:
  push:
    branches:
      - phase-g/data-extraction-wave1-evidence-w1-0c-repositories
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-g/data-extraction-wave1-evidence-w1-0c-repositories
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier rules
        run: |
          npx prettier --write \
            src/features/data-extraction/evidence/ports/evidence-repositories.ts \
            src/features/data-extraction/evidence/persistence/evidence-persistence.errors.ts \
            src/features/data-extraction/evidence/persistence/prisma-evidence-repositories.ts \
            src/features/data-extraction/evidence/evidence-repositories.architecture.test.ts \
            src/features/data-extraction/evidence/evidence-repositories.postgres.test.ts \
            src/features/data-extraction/data-extraction.module.ts
          rm .github/workflows/de-w1-0c-format.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(data-extraction): format Wave 1 repositories"
          git push origin HEAD:phase-g/data-extraction-wave1-evidence-w1-0c-repositories
